name: async-order-processor-test

# Portas dedicadas para nunca colidir com o ambiente de desenvolvimento: rodar a
# suite nao pode derrubar o que estiver subido no compose principal.
services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders_test
      MYSQL_USER: orders
      MYSQL_PASSWORD: orders
    ports: ["33307:3306"]
    # tmpfs: o banco de teste nao precisa sobreviver ao container, e sem disco a
    # suite de concorrencia fica dezenas de vezes mais rapida.
    tmpfs: ["/var/lib/mysql"]
    command: --default-authentication-plugin=caching_sha2_password --max-connections=300
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uorders", "-porders"]
      interval: 3s
      timeout: 5s
      retries: 30

  rabbitmq-test:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: orders
      RABBITMQ_DEFAULT_PASS: orders
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 3s
      timeout: 10s
      retries: 30

  # Keycloak de teste, em porta dedicada. Sobe junto com o resto para que a
  # suíte de integração de SSO rode contra o provedor DE VERDADE — validar
  # RS256 contra um JWKS mockado provaria que o mock funciona, não que a
  # integração funciona.
  keycloak-test:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-loja.json:/opt/keycloak/data/import/realm-loja.json:ro
    ports: ["8082:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
